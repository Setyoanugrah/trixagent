name: trixagent

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      OLLAMA_VERSION: "0.40.17"
      OLLAMA_SHA256: "1df9d6228bac5a22e420b242708c0d10e5b886db97bab99d446a41760f4e79af"
      AGENT_MODEL: "qwen3:4b-instruct-2507-q4_K_M"
      VISION_MODEL: "qwen3-vl:4b-instruct-q4_K_M"
      MODEL_CACHE_KEY: "ollama-linux-x64-0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0-84f7ed8042fa7cdbd902f7dcb7d0370e032095047cc3244179f263b77b5bc318"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "10m"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and test agent
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Install Chromium
        run: npx patchright install --with-deps chromium

      - name: Configure model cache
        run: |
          mkdir -p "$HOME/.cache/ollama/models"
          echo "OLLAMA_MODELS=$HOME/.cache/ollama/models" >> "$GITHUB_ENV"

      - name: Restore models
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ollama/models
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Install Ollama
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          archive="$RUNNER_TEMP/ollama.tar.zst"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            -o "$archive"
          printf '%s  %s\n' "$OLLAMA_SHA256" "$archive" | sha256sum -c -
          sudo tar --zstd -xf "$archive" -C /usr
          ollama --version

      - name: Pull and verify models
        run: |
          set -Eeuo pipefail
          ollama serve > "$RUNNER_TEMP/ollama-setup.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            kill -0 "$pid"
            sleep 1
          done
          timeout 45m ollama pull "$AGENT_MODEL"
          timeout 45m ollama pull "$VISION_MODEL"
          ollama show "$AGENT_MODEL" >/dev/null
          ollama show "$VISION_MODEL" >/dev/null

      - name: Save models
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ollama/models
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Run agent and rotate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          NEBULA_API_KEY: ${{ secrets.NEBULA_API_KEY }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          workspace="$RUNNER_TEMP/trixagent-workspace"
          mkdir -p "$workspace"

          setsid ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          OLLAMA_PID=$!
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            kill -0 "$OLLAMA_PID"
            sleep 1
          done

          start_agent() {
            env -i \
              PATH="$PATH" HOME="$HOME" LANG="C.UTF-8" CI="true" \
              TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
              TELEGRAM_OWNER_ID="$TELEGRAM_OWNER_ID" \
              NEBULA_API_KEY="$NEBULA_API_KEY" \
              NEBULA_BASE_URL="https://drive.rikuzetsi.my.id" \
              STATE_ENCRYPTION_KEY="$STATE_ENCRYPTION_KEY" \
              OLLAMA_BASE_URL="http://127.0.0.1:11434" \
              AGENT_MODEL="$AGENT_MODEL" VISION_MODEL="$VISION_MODEL" \
              AGENT_MAX_CONTEXT_TOKENS="32768" AGENT_MAX_ITERATIONS="20" \
              OLLAMA_MODELS="$OLLAMA_MODELS" WORKSPACE_ROOT="$workspace" \
              RUNNER_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              LEASE_NAME="trixagent" LEASE_TTL_SECONDS="90" LEASE_HEARTBEAT_SECONDS="25" \
              BROWSER_HEADLESS="true" AGENT_UNSAFE_AUTO="false" \
              NEBULA_SNAPSHOT_ON_SHUTDOWN="true" NEBULA_SNAPSHOT_INTERVAL_MINUTES="30" \
              setsid node dist/src/index.js >> "$RUNNER_TEMP/agent.log" 2>&1 &
            AGENT_PID=$!
          }

          cleanup() {
            set +e
            if [[ -n "${AGENT_PID:-}" ]] && kill -0 "$AGENT_PID" 2>/dev/null; then
              kill -TERM -- "-$AGENT_PID" 2>/dev/null || kill -TERM "$AGENT_PID" 2>/dev/null
              for _ in $(seq 1 300); do
                kill -0 "$AGENT_PID" 2>/dev/null || break
                sleep 1
              done
              kill -KILL -- "-$AGENT_PID" 2>/dev/null || true
            fi
            kill -TERM -- "-$OLLAMA_PID" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          start_agent
          sleep 5
          kill -0 "$AGENT_PID"

          for minute in $(seq 1 320); do
            sleep 60
            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              start_agent
            fi
            if [[ "$minute" -eq 290 ]]; then
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runner.yml/dispatches" \
                -d '{"ref":"main"}'
            fi
            if (( minute % 5 == 0 )); then
              curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
              python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'agent.log'
          if p.exists():
              print('\n'.join(p.read_text(errors='replace').splitlines()[-5:]))
          PY
            fi
          done
