name: watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trixagent-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure an agent runner exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          active=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runner.yml/runs?per_page=20" \
            | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | select((now - (.created_at | fromdateiso8601)) < 24000)] | length')
          if [[ "$active" -eq 0 ]]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runner.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
